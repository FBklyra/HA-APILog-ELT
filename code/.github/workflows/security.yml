name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  vendor-neutral:
    name: Public core is vendor-neutral
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: No legacy-vendor mentions outside .publicignore paths
        run: |
          # Term assembled at runtime so this workflow does not match itself.
          term="five""tran"
          excludes=()
          if [ -f .publicignore ]; then
            while IFS= read -r line || [ -n "$line" ]; do
              line="${line%%#*}"; line="$(echo "$line" | xargs)"
              [ -z "$line" ] && continue
              excludes+=(":(exclude)${line}")
            done < .publicignore
          else
            echo "::error::.publicignore missing"; exit 1
          fi
          if git grep -n -i -I "$term" -- . "${excludes[@]}"; then
            echo "::error::Vendor name found in public core (see matches above)"
            exit 1
          fi
          # File and directory names too
          if git ls-files -- . "${excludes[@]}" | grep -i "$term"; then
            echo "::error::Vendor name found in public file paths"
            exit 1
          fi
          echo "public core clean"

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  npm-audit:
    name: Dependency audit (console)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: npm audit --audit-level=high

  pip-audit:
    name: Dependency audit (Python)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: "pip-audit (every hashed lock - image, CI, Linux agent)"
        run: |
          python -m pip install --require-hashes --no-deps -r deploy/image/requirements-ci.lock
          for l in deploy/image/requirements.lock deploy/image/requirements-ci.lock deploy/linux/requirements-agent.lock; do
            echo "== $l"; pip-audit --strict --require-hashes --disable-pip -r "$l"
          done
