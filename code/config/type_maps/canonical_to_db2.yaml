# Canonical type -> IBM Db2 LUW physical type (dialect db2, e.g. Db2 -> Db2 replica).
engine: db2
types:
  BOOLEAN: boolean
  SHORT: smallint
  INT: integer
  LONG: bigint
  DECIMAL: decimal({p},{s})
  FLOAT: real
  DOUBLE: double
  LOCALDATE: date
  LOCALTIME: time
  LOCALDATETIME: timestamp(12)
  INSTANT: timestamp(12)        # stored as UTC (no zoned type)
  STRING: varchar({n})
  BINARY: varbinary({n})
  JSON: clob(2G)
  XML: clob(2G)
  UNKNOWN: null
defaults:
  STRING_without_length: clob(2G)
  STRING_over_max: clob(2G)
  BINARY_without_length: blob(2G)
  BINARY_over_max: blob(2G)
  DECIMAL_without_precision: decimal(31,10)
  DECIMAL_over_max: decimal(31,10)
limits:
  max_varchar: 8000             # fits a 32K page; longer strings go to clob
  max_varbinary: 8000
  max_decimal_precision: 31
