{{- include "alelt.validate" . -}}
{{- $db := include "alelt.inlineDbUrl" . -}}
{{- if include "alelt.hasChartSecret" . }}
# Chart-rendered Secret: inline/demo values only (refused with ALELT_ENV=prod, DEP-19). Production: existingSecret (R9).
# Normal release resource for the workloads (DEP-17); the migrate hook gets its own hook-scoped copy below.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alelt.fullname" . }}-env
  labels: {{- include "alelt.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if and $db (not .Values.externalDatabase.existingSecret) }}
  ALELT_DB_URL: {{ $db | quote }}
  {{- end }}
  {{- if and .Values.demo.minio.enabled (not .Values.s3.existingSecret) }}
  ALELT_S3_ACCESS_KEY_ID: {{ .Values.demo.minio.rootUser | quote }}
  ALELT_S3_SECRET_ACCESS_KEY: {{ .Values.demo.minio.rootPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.create }}
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- if eq (include "alelt.migrateHook" .) "true" }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "alelt.fullname" . }}-migrate-env
  labels: {{- include "alelt.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
type: Opaque
stringData:
  {{- if and $db (not .Values.externalDatabase.existingSecret) }}
  ALELT_DB_URL: {{ $db | quote }}
  {{- end }}
  {{- if and .Values.demo.minio.enabled (not .Values.s3.existingSecret) }}
  ALELT_S3_ACCESS_KEY_ID: {{ .Values.demo.minio.rootUser | quote }}
  ALELT_S3_SECRET_ACCESS_KEY: {{ .Values.demo.minio.rootPassword | quote }}
  {{- end }}
  {{- if .Values.secrets.create }}
  {{- range $k, $v := .Values.secrets.values }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
  {{- end }}
{{- end }}
{{- end }}
