# Overlay: secrets as files (Docker secrets / Swarm secrets) instead of plain env values (R9).
#   compose: docker compose -f docker-compose.ha.yml -f docker-compose.ha.secrets.yml up -d
#   Swarm:   docker secret create alelt_db_url - ; docker secret create alelt_s3_secret_access_key - ; ... then
#            docker stack deploy -c docker-compose.ha.yml -c docker-compose.ha.secrets.yml alelt
#            (for secrets already in the Swarm store, replace each `file:` below with `external: true`)
# Files default to ./secrets/<name> (outside Git, chmod 600). The image reads ALELT_<NAME>_FILE into ALELT_<NAME> at start.
x-alelt-secret-env: &alelt-secret-env
  ALELT_DB_URL_FILE: /run/secrets/alelt_db_url
  ALELT_DEST_URL_FILE: /run/secrets/alelt_dest_url
  ALELT_S3_ACCESS_KEY_ID_FILE: /run/secrets/alelt_s3_access_key_id
  ALELT_S3_SECRET_ACCESS_KEY_FILE: /run/secrets/alelt_s3_secret_access_key
  ALELT_AGENT_TOKENS_FILE: /run/secrets/alelt_agent_tokens

x-alelt-secrets: &alelt-secrets
  - alelt_db_url
  - alelt_dest_url
  - alelt_s3_access_key_id
  - alelt_s3_secret_access_key
  - alelt_agent_tokens

services:
  migrate:
    environment: *alelt-secret-env
    secrets: *alelt-secrets
  alelt:
    environment: *alelt-secret-env
    secrets: *alelt-secrets
  alelt-worker:
    environment: *alelt-secret-env
    secrets: *alelt-secrets

secrets:
  alelt_db_url:
    file: ${ALELT_SECRETS_DIR:-./secrets}/alelt_db_url
  alelt_dest_url:
    file: ${ALELT_SECRETS_DIR:-./secrets}/alelt_dest_url
  alelt_s3_access_key_id:
    file: ${ALELT_SECRETS_DIR:-./secrets}/alelt_s3_access_key_id
  alelt_s3_secret_access_key:
    file: ${ALELT_SECRETS_DIR:-./secrets}/alelt_s3_secret_access_key
  alelt_agent_tokens:
    file: ${ALELT_SECRETS_DIR:-./secrets}/alelt_agent_tokens
