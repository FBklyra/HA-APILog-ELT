# ALELT API LB (optional, compose profile `lb`). Any LB works (cloud LB, F5, HAProxy, nginx); the contract is:
#   round-robin over the api replicas · health check GET /readyz (200) · timeouts longer than the agent long-poll
#   (`hub.command_wait_s`, default 10 s) plus a batch upload · WebSocket allowed on /agent/v1/control.
# Demo LB (plain HTTP): agent mTLS is NOT possible here - the client-cert header is always deleted, so a client can
# never assert an identity through it (DEP-01). Production agent mTLS: lb/haproxy-mtls.cfg.
global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    http
    option  httplog
    option  forwardfor
    timeout connect      5s
    timeout client       120s
    timeout server       120s
    timeout http-request 30s
    timeout tunnel       1h
    retries 2
    option  redispatch

resolvers docker
    nameserver dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    hold valid 10s

frontend alelt_in
    bind :8080
    http-request del-header X-SSL-Client-Fingerprint
    http-request del-header X-ALELT-Client-Cert-Thumbprint
    http-request del-header X-ALELT-Dev-Role
    default_backend alelt_api

backend alelt_api
    balance roundrobin
    option httpchk GET /readyz
    http-check expect status 200
    default-server inter 5s fall 2 rise 2
    # one slot per replica found in DNS (compose: service name `alelt`; Swarm: use `tasks.alelt`)
    # 16 slots (DEP-15): replicas beyond the slot count get no traffic - raise it before scaling past 16
    server-template api 16 alelt:8080 check resolvers docker init-addr libc,none

frontend stats
    bind :8404
    stats enable
    stats uri /
    # DEP-14: published on 127.0.0.1 only (compose) and password-protected; set ALELT_LB_STATS_PASSWORD in .env
    stats auth "${ALELT_LB_STATS_USER}:${ALELT_LB_STATS_PASSWORD}"
    stats refresh 10s
