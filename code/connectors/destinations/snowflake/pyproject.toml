[project]
name = "alelt-dst-snowflake"
version = "0.1.0"
description = "ALELT Snowflake destination connector"
authors = [{ name = "Freddy Beltran" }]
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.6",
  "pyarrow>=15",
  "pyyaml>=6",
  "snowflake-connector-python>=3.10",
  "cryptography>=42",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools]
packages = ["alelt_dst_snowflake"]
