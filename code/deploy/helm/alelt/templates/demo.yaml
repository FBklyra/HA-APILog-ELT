{{- /* Demo backing services for an HA rehearsal on one cluster. NOT production: single replica, plain credentials. */ -}}
{{- if .Values.demo.postgres.enabled }}
{{- with .Values.demo.postgres }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "alelt.fullname" $ }}-postgres
  labels: {{- include "alelt.labels" $ | nindent 4 }}
spec:
  selector: {{- include "alelt.selector" (dict "root" $ "component" "demo-postgres") | nindent 4 }}
  ports: [{ name: pg, port: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "alelt.fullname" $ }}-postgres
  labels: {{- include "alelt.labels" $ | nindent 4 }}
spec:
  serviceName: {{ include "alelt.fullname" $ }}-postgres
  replicas: 1
  selector:
    matchLabels: {{- include "alelt.selector" (dict "root" $ "component" "demo-postgres") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "alelt.selector" (dict "root" $ "component" "demo-postgres") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: {{ .image }}
          resources: {{- toYaml $.Values.demo.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          env:
            - { name: POSTGRES_USER, value: {{ .user | quote }} }
            - { name: POSTGRES_PASSWORD, value: {{ .password | quote }} }
            - { name: POSTGRES_DB, value: {{ .database | quote }} }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          ports: [{ name: pg, containerPort: 5432 }]
          readinessProbe:
            exec: { command: ["pg_isready", "-U", {{ .user | quote }}] }
            periodSeconds: 5
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .storage }} } }
{{- end }}
{{- end }}
{{- if .Values.demo.minio.enabled }}
{{- with .Values.demo.minio }}
---
# Bundled S3-compatible spool (SeaweedFS, single instance). Service name kept as <release>-minio for compatibility.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "alelt.fullname" $ }}-minio
  labels: {{- include "alelt.labels" $ | nindent 4 }}
spec:
  selector: {{- include "alelt.selector" (dict "root" $ "component" "demo-minio") | nindent 4 }}
  ports: [{ name: s3, port: 9000 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "alelt.fullname" $ }}-minio
  labels: {{- include "alelt.labels" $ | nindent 4 }}
spec:
  serviceName: {{ include "alelt.fullname" $ }}-minio
  replicas: 1
  selector:
    matchLabels: {{- include "alelt.selector" (dict "root" $ "component" "demo-minio") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "alelt.selector" (dict "root" $ "component" "demo-minio") | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: s3
          image: {{ .image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              printf '{"identities":[{"name":"alelt","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Admin","Read","List","Tagging","Write"]}]}' "$S3_ACCESS_KEY" "$S3_SECRET_KEY" > /tmp/s3.json
              weed server -dir=/data -s3 -s3.port=9000 -s3.config=/tmp/s3.json -master.volumeSizeLimitMB=1024 &
              until echo 's3.bucket.list' | weed shell -master=127.0.0.1:9333 -filer=127.0.0.1:8888 2>/dev/null | grep -q "{{ .bucket }}"; do
                echo 's3.bucket.create -name {{ .bucket }}' | weed shell -master=127.0.0.1:9333 -filer=127.0.0.1:8888 >/dev/null 2>&1; sleep 2
              done
              touch /tmp/bucket-ok; wait
          env:
            - { name: S3_ACCESS_KEY, value: {{ .rootUser | quote }} }
            - { name: S3_SECRET_KEY, value: {{ .rootPassword | quote }} }
          ports: [{ name: s3, containerPort: 9000 }]
          readinessProbe:
            exec: { command: ["test", "-f", "/tmp/bucket-ok"] }
            periodSeconds: 5
          resources: {{- toYaml $.Values.demo.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts: [{ name: data, mountPath: /data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: {{ .storage }} } }
{{- end }}
{{- end }}
