# ALELT hub metadata DB - PostgreSQL 16 (VM 8 vCPU / 32 GB, Postgres gets ~8 GB)
listen_addresses = '*'
max_connections = 200
shared_buffers = 4GB
effective_cache_size = 12GB
work_mem = 32MB
maintenance_work_mem = 1GB
random_page_cost = 1.1
effective_io_concurrency = 200

# Durability (job queue + batch receipts)
fsync = on
synchronous_commit = on
full_page_writes = on
wal_compression = zstd
max_wal_size = 8GB
checkpoint_timeout = 15min

# WAL archiving for PITR (archive lives on the backup disk; offsite sync by backup/offsite-sync.sh)
wal_level = replica
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f.tmp && mv /var/lib/postgresql/wal_archive/%f.tmp /var/lib/postgresql/wal_archive/%f'
archive_timeout = 300

# Logging (JSON to stderr -> docker logs)
logging_collector = off
log_destination = 'jsonlog'
log_min_duration_statement = 2000
log_checkpoints = on
log_lock_waits = on
log_timezone = 'UTC'
timezone = 'UTC'

password_encryption = scram-sha-256
