# Included by every console-host location that proxies to the hub (DEP-26): client-supplied identity headers never
# reach the hub from the console vhost. The agent vhost overwrites X-SSL-Client-Fingerprint from the verified cert.
proxy_set_header X-SSL-Client-Fingerprint "";
proxy_set_header X-ALELT-Client-Cert-Thumbprint "";
proxy_set_header X-ALELT-Client-Cert-Serial "";
proxy_set_header X-ALELT-Dev-Role "";
