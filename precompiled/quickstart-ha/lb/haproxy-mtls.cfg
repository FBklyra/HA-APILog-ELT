# Production LB with agent mTLS (F-14 / DEP-01). TLS terminates HERE; the hub trusts the fingerprint header only
# from this LB's address (ALELT_TRUSTED_PROXIES) and only after this LB verified the client certificate.
#   /etc/haproxy/tls/server.pem   server cert + key (console + agent host)
#   /etc/haproxy/tls/agent-ca.pem internal CA that issues agent certificates (+ crl-file for revocation)
global
    log stdout format raw local0
    maxconn 4096
    ssl-default-bind-options ssl-min-ver TLSv1.2

defaults
    log     global
    mode    http
    option  httplog
    option  forwardfor
    timeout connect      5s
    timeout client       120s
    timeout server       120s
    timeout http-request 30s
    timeout tunnel       1h

resolvers docker
    nameserver dns 127.0.0.11:53
    hold valid 10s

# console + API (browser / OIDC): no client certificate; identity headers are always removed
frontend console
    bind :443 ssl crt /etc/haproxy/tls/server.pem alpn h2,http/1.1
    http-request del-header X-SSL-Client-Fingerprint
    http-request del-header X-ALELT-Dev-Role
    http-request deny if { path_beg /agent/ }
    default_backend alelt_api

# agents: certificate REQUIRED and verified; the header is overwritten from the verified certificate
frontend agents
    bind :8443 ssl crt /etc/haproxy/tls/server.pem ca-file /etc/haproxy/tls/agent-ca.pem verify required crl-file /etc/haproxy/tls/agent-ca.crl
    http-request del-header X-SSL-Client-Fingerprint
    http-request set-header X-SSL-Client-Fingerprint %[ssl_c_sha1,hex]
    http-request deny unless { path_beg /agent/ }
    default_backend alelt_api

backend alelt_api
    balance roundrobin
    option httpchk GET /readyz
    http-check expect status 200
    default-server inter 5s fall 2 rise 2
    server-template api 4 alelt:8080 check resolvers docker init-addr libc,none
