# ALELT front door. Two SNI hosts on :443
#   console host  -> console SPA + /api/v1 (Entra ID JWT checked by hub)
#   agent host    -> /agent/v1/* with mandatory mTLS (R4: agent connects outbound to us)
# Replace server_name values at install (runbooks/install-hub.md).
worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;

  log_format json escape=json '{"ts":"$time_iso8601","component":"proxy","host":"$host","remote":"$remote_addr",'
                              '"method":"$request_method","uri":"$uri","status":$status,"bytes":$body_bytes_sent,'
                              '"rt":$request_time,"client_cert":"$ssl_client_fingerprint","req_id":"$request_id"}';
  access_log /dev/stdout json;
  error_log  /dev/stderr warn;

  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:TLS:10m;
  ssl_session_tickets off;

  # DEP-26: agents are limited per client certificate, not per IP (a NAT'd fleet shares one address)
  limit_req_zone $ssl_client_fingerprint zone=agent:10m rate=50r/s;
  limit_req_zone $binary_remote_addr zone=api:10m   rate=20r/s;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  upstream hub { server hub-api:8080; keepalive 32; }

  # ---------------------------------------------------------------- console + API
  server {
    listen 443 ssl default_server;
    http2 on;
    server_name alelt.example.internal;
    ssl_certificate     /etc/nginx/tls/server.crt;
    ssl_certificate_key /etc/nginx/tls/server.key;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://login.microsoftonline.com; frame-ancestors 'none'; img-src 'self' data:; style-src 'self' 'unsafe-inline'" always;

    root /usr/share/nginx/html;

    location / { try_files $uri /index.html; }
    location /assets/ { expires 30d; add_header Cache-Control "public, immutable"; }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      client_max_body_size 10m;
      proxy_pass http://hub;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header X-Request-Id $request_id;
      proxy_set_header X-SSL-Client-Fingerprint "";      # never trusted from browsers (F-14)
      proxy_set_header X-ALELT-Client-Cert-Thumbprint "";
      proxy_set_header X-ALELT-Dev-Role "";                 # dev-mode header stripped in prod
    }

    # DEP-26: identity / dev headers are blanked on EVERY proxied console path, not only /api/
    location = /healthz { proxy_pass http://hub; access_log off; include /etc/nginx/alelt-strip-identity.conf; }
    location = /readyz  { proxy_pass http://hub; access_log off; include /etc/nginx/alelt-strip-identity.conf; }
    location = /metrics { allow 127.0.0.1; deny all; proxy_pass http://hub; include /etc/nginx/alelt-strip-identity.conf; }
    location /agent/    { return 421; }   # agents must use the mTLS host
  }

  # ---------------------------------------------------------------- agent gateway (mTLS)
  server {
    listen 443 ssl;
    http2 off;                          # WinHTTP WebSocket upgrade needs HTTP/1.1
    server_name agent.alelt.example.internal;
    ssl_certificate        /etc/nginx/tls/server.crt;
    ssl_certificate_key    /etc/nginx/tls/server.key;
    ssl_client_certificate /etc/nginx/tls/agent-ca.crt;   # internal PKI issuing CA chain
    # An EXPIRED CRL rejects every agent: alert on it (AleltAgentCrlExpiring in deploy/hub/observability/alerts.yml,
    # fed by the node-exporter textfile from deploy/hub/secrets/crl-expiry.sh) and refresh it before nextUpdate.
    ssl_crl                /etc/nginx/tls/agent-ca.crl;
    ssl_verify_client on;
    ssl_verify_depth 3;

    client_max_body_size 64m;          # keep >= ALELT_MAX_BODY_BYTES
    proxy_request_buffering off;

    location /agent/v1/control {
      proxy_pass http://hub;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-SSL-Client-Fingerprint $ssl_client_fingerprint;   # overwrites any client value; SHA-1
      proxy_set_header X-ALELT-Client-Cert-Serial $ssl_client_serial;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-ALELT-Dev-Role "";
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location /agent/v1/ {
      limit_req zone=agent burst=100 nodelay;
      proxy_pass http://hub;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-SSL-Client-Fingerprint $ssl_client_fingerprint;   # overwrites any client value
      proxy_set_header X-ALELT-Client-Cert-Serial $ssl_client_serial;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-ALELT-Dev-Role "";
      proxy_set_header X-Request-Id $request_id;
      proxy_read_timeout 120s;
    }

    location / { return 404; }
  }
}
