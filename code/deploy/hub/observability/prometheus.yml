global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    system: alelt
    env: prod

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  # Hub API exports pipeline metrics, including agent metrics relayed from heartbeats.
  - job_name: hub-api
    metrics_path: /metrics
    static_configs:
      - targets: ["hub-api:8080"]

  # Workers expose /metrics on :9100 (prometheus_client multiprocess not needed: one process per container).
  - job_name: worker
    dns_sd_configs:
      - names: ["worker"]
        type: A
        port: 9100

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
